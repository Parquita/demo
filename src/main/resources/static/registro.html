<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Virtual - Registro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f19b9c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            display: flex;
            width: 750px;
            height: 450px;
            background-color: white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        .left-panel {
            background-color: #c9e4f2;
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .left-panel img {
            width: 150px;
            margin-bottom: 20px;
        }

        .left-panel h1 {
            margin: 0;
            font-size: 24px;
            color: #000;
        }

        .left-panel p {
            margin-top: 5px;
            font-size: 14px;
            color: #333;
        }

        .right-panel {
            width: 55%;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }

        .right-panel h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }

        .btn-submit {
            background-color: #2c5468;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1e3a48;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }

        .login-link a {
            color: #2c5468;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="left-panel">
            <div style="font-size: 100px; margin-bottom: 10px;">📚</div>
            <h1>BIBLIOTECA<br>VIRTUAL</h1>
            <p>Acceso al conocimiento</p>
        </div>

        <div class="right-panel">
            <h2>REGISTRARSE</h2>
            <form id="registroForm">
                <div class="input-group">
                    <input type="text" id="usuario" placeholder="Nombre de usuario" required>
                </div>
                <div class="input-group">
                    <input type="email" id="correo" placeholder="Correo electrónico" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn-submit">CREAR CUENTA</button>

                <p class="login-link">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            const payload = {
                usuario: usuario,
                correo: correo,
                contraseña: password
            };

            fetch('/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(respuesta => {
                    if (respuesta.ok) {
                        alert("¡Cuenta creada con éxito! Ahora puedes iniciar sesión.");
                        window.location.href = "index.html";
                    } else {
                        return respuesta.text().then(text => { throw new Error(text) });
                    }
                })
                .catch(error => {
                    alert("Error al registrarse: " + error.message);
                });
        });
    </script>
</body>

</html>
